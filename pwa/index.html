<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#000000">
    <meta name="description" content="A browser PWA port of Stickvania.">
    <meta name="app-version" content="%APP_VERSION%">
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest?v=%BUILD_STAMP%">
    <link rel="icon" href="%BASE_URL%images/icon.png?v=%BUILD_STAMP%" type="image/png">
    <style>
        /* Critical boot styles prevent first-paint fallback text flash. */
        html,
        body,
        #app {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #000000;
            color: #f8f8f8;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            position: fixed;
            inset: 0;
        }

        .boot-screen {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000000;
        }

        .boot-dots {
            display: grid;
            width: 40px;
            height: 8px;
            grid-template-columns: repeat(3, 8px);
            gap: 8px;
        }

        .boot-dot {
            width: 8px;
            height: 8px;
            background: #f8f8f8;
            opacity: 0;
        }

        .boot-dot:nth-child(1) {
            animation: boot-dot-one 1.2s steps(1, end) infinite;
        }

        .boot-dot:nth-child(2) {
            animation: boot-dot-two 1.2s steps(1, end) infinite;
        }

        .boot-dot:nth-child(3) {
            animation: boot-dot-three 1.2s steps(1, end) infinite;
        }

        .load-error-panel {
            display: none;
            width: min(420px, calc(100vw - 48px));
            gap: 14px;
            justify-items: center;
            text-align: center;
        }

        .failure-icon {
            color: #ffffff;
            font-family: "Segoe UI Emoji", "Apple Color Emoji", "Noto Color Emoji", "Segoe UI Symbol", Arial, Helvetica, sans-serif;
            font-size: 52px;
            line-height: 1;
        }

        .boot-title {
            color: #ffffff;
            font-size: 26px;
            font-weight: 700;
        }

        .boot-error {
            display: none;
            max-width: 280px;
            margin: 0;
            color: #ffffff;
            font-size: 14px;
            line-height: 1.45;
            text-align: center;
        }

        .load-error-panel .boot-error {
            display: block;
        }

        .retry-link {
            display: inline-flex;
            min-width: 192px;
            min-height: 48px;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
            padding: 10px 20px;
            border-radius: 30px;
            background: #ffffff;
            color: #000000;
            cursor: pointer;
            font-size: 18px;
            font-weight: 700;
            text-decoration: none;
            text-shadow: none;
        }

        .retry-link:active {
            transform: translateY(2px);
        }

        .boot-failed .boot-dots {
            display: none;
        }

        .boot-failed .load-error-panel {
            display: grid;
        }

        .boot-failed .boot-error {
            display: block;
        }

        @keyframes boot-dot-one {
            0%,
            100% {
                opacity: 1;
            }

            33%,
            66% {
                opacity: 0;
            }
        }

        @keyframes boot-dot-two {
            0%,
            33%,
            100% {
                opacity: 0;
            }

            34%,
            66% {
                opacity: 1;
            }
        }

        @keyframes boot-dot-three {
            0%,
            66% {
                opacity: 0;
            }

            67%,
            100% {
                opacity: 1;
            }
        }
    </style>
    <noscript>
        <style>
            .boot-dots {
                display: none;
            }

            .load-error-panel {
                display: grid;
            }
        </style>
    </noscript>
    <title>Stickvania</title>
</head>
<body>
    <main id="app">
        <div id="boot-screen" class="boot-screen" role="status" aria-label="Loading">
            <div class="boot-dots" aria-hidden="true">
                <span class="boot-dot"></span>
                <span class="boot-dot"></span>
                <span class="boot-dot"></span>
            </div>
            <section id="static-load-error" class="load-error-panel" aria-label="Unable to start">
                <div class="failure-icon" aria-hidden="true">&#x1F480;</div>
                <div class="boot-title">Unable to start.</div>
                <p class="boot-error">Check your connection and try again.</p>
                <a class="retry-link" href="">Retry</a>
            </section>
        </div>
    </main>
    <script>
        window.setTimeout(function () {
            var boot = document.getElementById("boot-screen");
            if (!boot || !boot.isConnected) {
                return;
            }
            boot.classList.add("boot-failed");
        }, 10000);
    </script>
    <script type="module" src="/src/main.ts"></script>
</body>
</html>
