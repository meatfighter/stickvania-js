<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="theme-color" content="#000000" />
        <meta name="description" content="A browser PWA port of Stickvania." />
        <meta name="app-version" content="%APP_VERSION%" />
        <link rel="manifest" href="%BASE_URL%manifest.webmanifest?v=%CACHE_VERSION%" />
        <link rel="icon" href="%BASE_URL%images/icon.png?v=%CACHE_VERSION%" type="image/png" />
        <style>
            /* Critical boot styles prevent first-paint fallback text flash. */
            html,
            body,
            #app {
                width: 100%;
                height: 100%;
                margin: 0;
                padding: 0;
                overflow: hidden;
                background: #000000;
                color: #f8f8f8;
                font-family: Arial, Helvetica, sans-serif;
            }

            body {
                position: fixed;
                inset: 0;
            }

            .static-boot-screen {
                position: fixed;
                inset: 0;
                display: flex;
                align-items: center;
                justify-content: center;
                background: #000000;
            }

            .static-boot-dots {
                display: grid;
                width: 40px;
                height: 8px;
                grid-template-columns: repeat(3, 8px);
                gap: 8px;
            }

            .static-boot-dot {
                width: 8px;
                height: 8px;
                background: #f8f8f8;
                animation: static-boot-dot-pulse 1.2s ease-in-out infinite;
                opacity: 0.25;
            }

            .static-boot-dot:nth-child(1) {
                animation-delay: 0s;
            }

            .static-boot-dot:nth-child(2) {
                animation-delay: 0.2s;
            }

            .static-boot-dot:nth-child(3) {
                animation-delay: 0.4s;
            }

            .static-load-error-panel {
                display: none;
                width: min(420px, calc(100vw - 48px));
                gap: 14px;
                justify-items: center;
                text-align: center;
            }

            .static-failure-icon {
                color: #ffffff;
                font-family: "Segoe UI Emoji", "Apple Color Emoji", "Noto Color Emoji", "Segoe UI Symbol", Arial, Helvetica, sans-serif;
                font-size: 52px;
                line-height: 1;
            }

            .static-boot-title {
                color: #ffffff;
                font-size: 26px;
                font-weight: 700;
            }

            .static-boot-error {
                display: none;
                max-width: 280px;
                margin: 0;
                color: #ffffff;
                font-size: 14px;
                line-height: 1.45;
                text-align: center;
            }

            .static-load-error-panel .static-boot-error {
                display: block;
            }

            .static-retry-link {
                display: inline-flex;
                min-width: 192px;
                min-height: 48px;
                align-items: center;
                justify-content: center;
                box-sizing: border-box;
                padding: 10px 20px;
                border-radius: 30px;
                background: #ffffff;
                color: #000000;
                cursor: pointer;
                font-size: 18px;
                font-weight: 700;
                text-decoration: none;
                text-shadow: none;
            }

            .static-retry-link:active {
                transform: translateY(2px);
            }

            .static-boot-failed .static-boot-dots {
                display: none;
            }

            .static-boot-failed .static-load-error-panel {
                display: grid;
            }

            .static-boot-failed .static-boot-error {
                display: block;
            }

            @keyframes static-boot-dot-pulse {
                0%,
                80%,
                100% {
                    opacity: 0.25;
                }

                40% {
                    opacity: 1;
                }
            }
        </style>
        <noscript>
            <style>
                .static-boot-dots {
                    display: none;
                }

                .static-load-error-panel {
                    display: grid;
                }
            </style>
        </noscript>
        <script>
            (function () {
                var phase = "bootstrap";
                var timer = window.setTimeout(fail, 60000);
                function removeBootstrapListeners() {
                    window.removeEventListener("error", onError, true);
                    window.removeEventListener("unhandledrejection", fail);
                }
                function renderFailure() {
                    var boot = document.getElementById("static-boot-screen");
                    if (!boot || !boot.isConnected) return;
                    boot.classList.add("static-boot-failed");
                    var action = boot.querySelector(".static-retry-link");
                    if (action) action.focus();
                }
                function fail() {
                    if (phase !== "bootstrap") return;
                    phase = "failed";
                    clearTimeout(timer);
                    removeBootstrapListeners();
                    if (document.readyState === "loading") window.addEventListener("DOMContentLoaded", renderFailure, { once: true });
                    else renderFailure();
                }
                function claim() {
                    if (phase !== "bootstrap") return false;
                    phase = "app";
                    clearTimeout(timer);
                    removeBootstrapListeners();
                    return true;
                }
                function hasSameOriginUrl(text) {
                    try {
                        return new URL(text, window.location.href).origin === window.location.origin;
                    } catch {
                        return false;
                    }
                }
                function onError(event) {
                    var target = event.target;
                    if (
                        target === window ||
                        (target instanceof HTMLScriptElement && target.type === "module" && hasSameOriginUrl(target.src)) ||
                        (target instanceof HTMLLinkElement && target.rel === "stylesheet" && hasSameOriginUrl(target.href))
                    )
                        fail();
                }
                window.__stickvaniaBootstrap = { claim: claim, fail: fail };
                window.addEventListener("error", onError, true);
                window.addEventListener("unhandledrejection", fail);
            })();
        </script>
        <title>Stickvania</title>
    </head>
    <body>
        <main id="app">
            <div id="static-boot-screen" class="static-boot-screen" role="status" aria-label="Loading">
                <div class="static-boot-dots" aria-hidden="true">
                    <span class="static-boot-dot"></span>
                    <span class="static-boot-dot"></span>
                    <span class="static-boot-dot"></span>
                </div>
                <section id="static-load-error" class="static-load-error-panel" aria-label="Unable to start">
                    <div class="static-failure-icon" aria-hidden="true">&#x1F480;</div>
                    <div class="static-boot-title">Unable to start.</div>
                    <p class="static-boot-error">Check your connection and try again.</p>
                    <a class="static-retry-link" href="">Reload</a>
                </section>
            </div>
        </main>
        <script type="module" src="/src/main.ts"></script>
    </body>
</html>
