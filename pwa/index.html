<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#000000">
    <meta name="description" content="A browser PWA port of Stickvania.">
    <meta name="app-version" content="%APP_VERSION%">
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest?v=%BUILD_STAMP%">
    <link rel="icon" href="%BASE_URL%images/icon.png?v=%BUILD_STAMP%" type="image/png">
    <style>
        /* Critical boot styles prevent first-paint fallback text flash. */
        html,
        body,
        #app {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #000000;
            color: #f8f8f8;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            position: fixed;
            inset: 0;
        }

        .boot-screen {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000000;
        }

        .boot-dots {
            display: grid;
            width: 40px;
            height: 8px;
            grid-template-columns: repeat(3, 8px);
            gap: 8px;
        }

        .boot-dot {
            width: 8px;
            height: 8px;
            background: #f8f8f8;
            opacity: 0;
        }

        .boot-error {
            display: none;
            max-width: 280px;
            font-size: 14px;
            line-height: 1.45;
            text-align: center;
        }

        .boot-failed .boot-dots {
            display: none;
        }

        .boot-failed .boot-error {
            display: block;
        }
    </style>
    <noscript>
        <style>
            .boot-dots {
                display: none;
            }

            .boot-error {
                display: block;
            }
        </style>
    </noscript>
    <title>Stickvania</title>
</head>
<body>
    <main id="app">
        <div id="boot-screen" class="boot-screen" role="status" aria-label="Loading">
            <div class="boot-dots" aria-hidden="true">
                <span class="boot-dot"></span>
                <span class="boot-dot"></span>
                <span class="boot-dot"></span>
            </div>
            <div class="boot-error">Unable to start.<br>Check your connection and reload.</div>
        </div>
    </main>
    <script type="module" src="/src/main.ts"></script>
</body>
</html>
