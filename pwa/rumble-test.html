<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Stickvania Rumble Test</title>
        <style>
            :root {
                color-scheme: light;
                font-family: Arial, Helvetica, sans-serif;
                background: #fff;
                color: #000;
            }

            * {
                box-sizing: border-box;
            }

            body {
                margin: 0;
                min-height: 100vh;
                background:
                    linear-gradient(90deg, rgba(0, 0, 0, 0.04) 1px, transparent 1px), linear-gradient(0deg, rgba(0, 0, 0, 0.04) 1px, transparent 1px), #fff;
                background-size: 32px 32px;
            }

            main {
                width: min(1040px, calc(100vw - 32px));
                margin: 0 auto;
                padding: 32px 0 48px;
            }

            header {
                border: 4px solid #000;
                border-radius: 10px;
                padding: 20px;
                background: #fff;
                box-shadow: 8px 8px 0 #000;
            }

            h1 {
                margin: 0 0 8px;
                font-size: clamp(28px, 5vw, 56px);
                line-height: 1;
                letter-spacing: 0;
                text-transform: uppercase;
            }

            p {
                margin: 0;
                font-size: 16px;
                line-height: 1.45;
            }

            .toolbar {
                display: flex;
                flex-wrap: wrap;
                gap: 12px;
                align-items: center;
                margin: 24px 0;
            }

            button {
                min-height: 44px;
                border: 3px solid #000;
                border-radius: 999px;
                padding: 8px 18px;
                background: #fff;
                color: #000;
                font: inherit;
                font-weight: 700;
                cursor: pointer;
            }

            button:hover {
                background: #e8e8e8;
            }

            button:active {
                transform: translate(2px, 2px);
            }

            button:disabled {
                cursor: not-allowed;
                color: #777;
                border-color: #777;
            }

            select {
                min-height: 44px;
                border: 3px solid #000;
                border-radius: 8px;
                padding: 8px 12px;
                background: #fff;
                color: #000;
                font: inherit;
            }

            .panel {
                border: 3px solid #000;
                border-radius: 8px;
                background: #fff;
                padding: 16px;
                margin-bottom: 20px;
            }

            .panel h2 {
                margin: 0 0 12px;
                font-size: 20px;
                text-transform: uppercase;
            }

            .status-grid {
                display: grid;
                grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
                gap: 12px;
            }

            .gamepad-card {
                border: 2px solid #000;
                border-radius: 8px;
                padding: 12px;
                min-height: 116px;
            }

            .gamepad-card strong {
                display: block;
                margin-bottom: 6px;
            }

            .effects {
                display: grid;
                grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
                gap: 12px;
            }

            .effect-button {
                width: 100%;
                min-height: 64px;
                border-radius: 10px;
                text-align: left;
                display: flex;
                flex-direction: column;
                justify-content: center;
                gap: 4px;
            }

            .effect-button span {
                display: block;
                font-size: 12px;
                font-weight: 400;
            }

            .log {
                min-height: 180px;
                max-height: 260px;
                overflow: auto;
                border: 2px solid #000;
                border-radius: 8px;
                padding: 12px;
                background: #000;
                color: #fff;
                font:
                    13px/1.45 Consolas,
                    "Courier New",
                    monospace;
                white-space: pre-wrap;
            }

            .muted {
                color: #444;
            }
        </style>
    </head>
    <body>
        <main>
            <header>
                <h1>Stickvania Rumble Test</h1>
                <p>Standalone haptics test page. Connect a gamepad, press a button on it if the browser has not exposed it yet, then try each effect.</p>
            </header>

            <section class="toolbar" aria-label="Rumble controls">
                <button id="refresh-button" type="button">Refresh Gamepads</button>
                <button id="stop-button" type="button">Stop Rumble</button>
                <label>
                    Target
                    <select id="target-select" aria-label="Target gamepad">
                        <option value="all">All supported gamepads</option>
                    </select>
                </label>
            </section>

            <section class="panel">
                <h2>Connected Gamepads</h2>
                <div id="gamepad-status" class="status-grid"></div>
            </section>

            <section class="panel">
                <h2>Effects</h2>
                <div id="effect-buttons" class="effects"></div>
            </section>

            <section class="panel">
                <h2>Log</h2>
                <div id="log" class="log" role="log" aria-live="polite"></div>
            </section>
        </main>

        <script type="module" src="/src/rumble/RumbleTestPage.ts"></script>
    </body>
</html>
