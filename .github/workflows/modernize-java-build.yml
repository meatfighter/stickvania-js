name: Modernize Java desktop build

on:
    push:
        paths:
            - ".github/workflows/modernize-java-build.yml"
            - ".github/scripts/modernize-java-build.mjs"

permissions:
    contents: write

jobs:
    modernize:
        runs-on: ubuntu-latest
        timeout-minutes: 40

        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - name: Set up Node
              uses: actions/setup-node@v7
              with:
                  node-version: 22.13.0
                  cache: npm

            - name: Set up Java
              uses: actions/setup-java@v6
              with:
                  distribution: temurin
                  java-version: "21"

            - name: Install dependencies
              run: npm ci

            - name: Apply modernization
              run: node .github/scripts/modernize-java-build.mjs

            - name: Format
              run: npm run format

            - name: Check patch
              run: git diff --check

            - name: Verify
              run: npm run verify

            - name: Build production candidate
              run: npm run build

            - name: Commit validated changes
              shell: bash
              run: |
                  git add -A
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git commit -m "Modernize Java desktop build"
                  git push
