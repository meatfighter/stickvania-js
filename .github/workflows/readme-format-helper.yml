name: README Format Helper

on:
  push:
    branches:
      - chatgpt/prepublic-release-hardening-20260905
    paths:
      - .github/workflows/readme-format-helper.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: chatgpt/prepublic-release-hardening-20260905
      - uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx prettier README.md --write
      - run: |
          git config user.name "zeroone"
          git config user.email "54445200+meatfighter@users.noreply.github.com"
          git add README.md
          git commit -m "Format public Stickvania README"
          git push origin HEAD:chatgpt/prepublic-release-hardening-20260905
