name: Refresh Slick release guard

on:
    push:
        paths:
            - ".github/workflows/fix-slick-release-guard.yml"

permissions:
    contents: write

jobs:
    apply:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            - uses: actions/setup-node@v7
              with:
                  node-version: 22.13.0
                  cache: npm

            - run: npm ci

            - name: Update and format guards
              shell: bash
              run: |
                  node --input-type=module <<'NODE'
                  import { readFileSync, writeFileSync } from "node:fs";

                  function replaceExactlyOnce(path, oldText, newText) {
                      const before = readFileSync(path, "utf8");
                      const matches = before.split(oldText).length - 1;
                      if (matches !== 1) {
                          throw new Error(`${path}: expected exactly one match for ${JSON.stringify(oldText)}, found ${matches}.`);
                      }
                      writeFileSync(path, before.replace(oldText, newText));
                  }

                  replaceExactlyOnce(
                      "scripts/verify-pwa-release.mjs",
                      'const expectedSlick2dTsDependency = "git+https://github.com/meatfighter/slick2d-ts.git#semver:^1.3.1";',
                      'const expectedSlick2dTsDependency = "git+https://github.com/meatfighter/slick2d-ts.git#semver:^1.5.2";'
                  );
                  replaceExactlyOnce(
                      "scripts/verify-pwa-release.mjs",
                      'const expectedSlick2dTsVersion = "1.3.1";',
                      'const expectedSlick2dTsVersion = "1.5.2";'
                  );
                  replaceExactlyOnce(
                      "scripts/verify-pwa-release.mjs",
                      'assert.match(lockedSlick2dTsPackage.resolved, /^git\\+https:\\/\\/github\\.com\\/meatfighter\\/slick2d-ts\\.git#[a-f0-9]{40}$/);',
                      'assert.match(lockedSlick2dTsPackage.resolved, /^git\\+(?:https:\\/\\/github\\.com\\/|ssh:\\/\\/git@github\\.com\\/)meatfighter\\/slick2d-ts\\.git#[a-f0-9]{40}$/);'
                  );
                  NODE
                  npx prettier scripts/verify-pwa-release.mjs scripts/test-buffered-scaling-wiring.mjs --write
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git rm .github/workflows/fix-slick-release-guard.yml
                  git add scripts/verify-pwa-release.mjs scripts/test-buffered-scaling-wiring.mjs
                  git diff --cached --check
                  git commit -m "Refresh Slick release verification"
                  git push
