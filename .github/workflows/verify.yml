name: Verify

on:
    push:
    pull_request:
    workflow_dispatch:

jobs:
    verify:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Set up Node
              uses: actions/setup-node@v4
              with:
                  node-version: 22.13.0
                  cache: npm

            - name: Set up Java
              uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: "21"
                  cache: maven

            - name: Install dependencies
              run: npm ci

            - name: Verify
              run: npm run verify

            - name: Build
              run: npm run build
