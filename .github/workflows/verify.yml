name: Verify

on:
    push:
    pull_request:
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: verify-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    verify:
        runs-on: ubuntu-latest
        timeout-minutes: 30

        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Set up Node
              uses: actions/setup-node@v7
              with:
                  node-version: 22.13.0
                  cache: npm

            - name: Set up Java
              uses: actions/setup-java@v6
              with:
                  distribution: temurin
                  java-version: "21"

            - name: Verify Slick dependency is current
              run: |
                  slick_head="$(git ls-remote https://github.com/meatfighter/slick2d-ts.git refs/heads/main | awk '{print $1}')"
                  SLICK_HEAD="$slick_head" node --input-type=module <<'NODE'
                  import { readFileSync } from "node:fs";
                  const expected = `git+https://github.com/meatfighter/slick2d-ts.git#${process.env.SLICK_HEAD}`;
                  const pkg = JSON.parse(readFileSync("package.json", "utf8"));
                  const lock = JSON.parse(readFileSync("package-lock.json", "utf8"));
                  if (pkg.dependencies?.["slick2d-ts"] !== expected) throw new Error(`package.json Slick pin is stale: ${pkg.dependencies?.["slick2d-ts"]} != ${expected}`);
                  if (lock.packages?.[""]?.dependencies?.["slick2d-ts"] !== expected) throw new Error("package-lock.json root Slick dependency is stale.");
                  if (lock.packages?.["node_modules/slick2d-ts"]?.resolved !== expected) throw new Error(`package-lock.json Slick resolution is stale or not HTTPS: ${lock.packages?.["node_modules/slick2d-ts"]?.resolved}`);
                  NODE

            - name: Install dependencies
              run: npm ci

            - name: Verify
              run: npm run verify

            - name: Build
              run: npm run build

            - name: Verify real browser
              run: npm run verify:browser
