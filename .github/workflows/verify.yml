name: Verify

on:
    push:
    pull_request:
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: verify-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    verify:
        runs-on: ubuntu-latest
        timeout-minutes: 30

        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Set up Node
              uses: actions/setup-node@v7
              with:
                  node-version: 22.13.0
                  cache: npm

            - name: Set up Java
              uses: actions/setup-java@v6
              with:
                  distribution: temurin
                  java-version: "21"

            - name: Verify Slick dependency pin
              run: |
                  node --input-type=module <<'NODE'
                  import { readFileSync } from "node:fs";
                  const pkg = JSON.parse(readFileSync("package.json", "utf8"));
                  const lock = JSON.parse(readFileSync("package-lock.json", "utf8"));
                  const dependency = pkg.dependencies?.["slick2d-ts"];
                  if (typeof dependency !== "string" || !/^https:\/\/codeload\.github\.com\/meatfighter\/slick2d-ts\/tar\.gz\/[0-9a-f]{40}$/.test(dependency)) {
                      throw new Error(`package.json Slick dependency must be an immutable HTTPS commit archive: ${dependency}`);
                  }
                  if (lock.packages?.[""]?.dependencies?.["slick2d-ts"] !== dependency) {
                      throw new Error("package-lock.json root Slick dependency does not match package.json.");
                  }
                  if (lock.packages?.["node_modules/slick2d-ts"]?.resolved !== dependency) {
                      throw new Error("package-lock.json Slick resolution does not match the immutable package.json pin.");
                  }
                  NODE

            - name: Install dependencies
              run: npm ci

            - name: Dependency audit
              run: npm run verify:dependencies

            - name: Verify
              run: npm run verify

            - name: Build
              run: npm run build

            - name: Verify real browser
              run: npm run verify:browser
