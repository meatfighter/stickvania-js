name: Parity Schema Helper

on:
  push:
    branches:
      - chatgpt/prepublic-release-hardening-20260905
    paths:
      - .github/workflows/parity-schema-helper.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: chatgpt/prepublic-release-hardening-20260905
      - name: Update schema contract assertion
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/test-java-parity.mjs')
          text = path.read_text()
          old = 'assert.match(gameStateSchemaSource, /GAME_STATE_VERSION = 8;/);'
          new = 'assert.match(gameStateSchemaSource, /GAME_STATE_VERSION = 9;/);'
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one schema assertion, found {text.count(old)}')
          path.write_text(text.replace(old, new))
          PY
      - run: |
          git config user.name "zeroone"
          git config user.email "54445200+meatfighter@users.noreply.github.com"
          git add scripts/test-java-parity.mjs
          git commit -m "Update Stickvania save parity contract"
          git push origin HEAD:chatgpt/prepublic-release-hardening-20260905
