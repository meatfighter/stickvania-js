<!doctype html>
<html lang="en" data-theme="dark">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="theme-color" content="#000000" />
        <meta name="description" content="__DESCRIPTION__" />
        <meta name="application-name" content="Stickvania" />
        <meta name="stickvania:version" content="__APP_VERSION__" />
        <meta name="stickvania:build-stamp" content="__BUILD_STAMP__" />
        <link rel="canonical" href="__CANONICAL_URL__" />
        <meta property="og:type" content="website" />
        <meta property="og:site_name" content="meatfighter.com" />
        <meta property="og:title" content="Stickvania" />
        <meta property="og:description" content="__DESCRIPTION__" />
        <meta property="og:url" content="__CANONICAL_URL__" />
        <meta property="og:image" content="__SOCIAL_IMAGE_URL__" />
        <meta name="twitter:card" content="summary_large_image" />
        <meta name="twitter:title" content="Stickvania" />
        <meta name="twitter:description" content="__DESCRIPTION__" />
        <meta name="twitter:image" content="__SOCIAL_IMAGE_URL__" />
        <link
            rel="preload"
            href="./assets/fonts/source-sans-3/SourceSans3VF-Upright.ttf.woff2?v=__BUILD_STAMP_ENCODED__"
            as="font"
            type="font/woff2"
            crossorigin
        />
        <link rel="stylesheet" href="./styles.css?v=__BUILD_STAMP_ENCODED__" />
        <link rel="icon" href="./assets/icon.png?v=__BUILD_STAMP_ENCODED__" type="image/png" sizes="512x512" />
        <link rel="apple-touch-icon" href="./assets/icon.png?v=__BUILD_STAMP_ENCODED__" sizes="512x512" />
        <title>Stickvania</title>
        <script>
            (() => {
                try {
                    const theme = localStorage.getItem("stickvania-about-theme");
                    if (theme === "dark" || theme === "light") {
                        document.documentElement.dataset.theme = theme;
                    }
                } catch {
                    // Keep the default theme when storage is unavailable.
                }
            })();
        </script>
    </head>
    <body>
        <div class="page">
            <header class="site-header">
                <div class="site-header__inner">
                    <h1 class="site-title">
                        <a class="site-logo-link" href="./" aria-label="Stickvania">
                            <span class="sr-only">Stickvania</span>
                            <img
                                class="site-logo"
                                src="./__TITLE_SVG_SRC__"
                                alt=""
                                width="__TITLE_IMAGE_WIDTH__"
                                height="__TITLE_IMAGE_HEIGHT__"
                                decoding="async"
                            />
                        </a>
                    </h1>
                    <label class="theme-switch" for="theme-toggle">
                        <span class="sr-only">Toggle dark mode</span>
                        <input id="theme-toggle" type="checkbox" role="switch" aria-label="Toggle dark mode" />
                        <span class="theme-switch__track" aria-hidden="true"></span>
                    </label>
                </div>
            </header>

            <main id="main" class="site-main">
                __TOC_HTML__
                <article class="article" aria-label="About Stickvania">__ARTICLE_HTML__</article>
            </main>

            <footer class="site-footer">
                <div class="site-footer__inner">
                    <div class="site-footer__left">__FOOTER_HTML__</div>
                    <div class="site-footer__links">
                        <a href="__REPOSITORY_URL__" target="_blank" rel="noopener noreferrer">Source</a>
                        <span class="site-footer__separator" aria-hidden="true">|</span>
                        <a href="https://meatfighter.com/">Home</a>
                    </div>
                </div>
            </footer>
        </div>

        <script src="./theme.js?v=__BUILD_STAMP_ENCODED__"></script>
    </body>
</html>
